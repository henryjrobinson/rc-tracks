name: Weekly scrape

on:
  schedule:
    # Sundays 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper deps
        working-directory: scraper
        run: npm ci

      - name: Crawl LiveRC
        working-directory: scraper
        run: npm run crawl

      - name: Geocode addresses
        working-directory: scraper
        run: npm run geocode

      - name: Commit updated data
        run: |
          git config user.name "rc-tracks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore(data): weekly LiveRC refresh"
          git push
